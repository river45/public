name: CI Example

on:
#  push:
#    branches: [ "main", "master" ]   # main 또는 master 브랜치에 push될 때 실행
#  pull_request:
#    branches: [ "main", "master" ]   # main 또는 master 대상 PR 생성 시 실행
  workflow_dispatch:  # 수동 트리거 허용

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run a command
        run: |
          echo "Hello from Ubuntu!"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "GITHUB_REF env: '$GITHUB_REF'"
          echo "github.ref expression: '${{ github.ref }}'"
          echo "Commit: $GITHUB_SHA"
          echo "Event payload path: $GITHUB_EVENT_PATH"
          if [ -f "$GITHUB_EVENT_PATH" ]; then
            echo "--- Event payload start ---"
            # Try to pretty-print JSON if jq is available, otherwise cat
            cat "$GITHUB_EVENT_PATH" | jq '.' || cat "$GITHUB_EVENT_PATH"
            echo "--- Event payload end ---"
          else
            echo "No event payload file present"
          fi
          echo "--- Workspace listing ---"
          ls -la
          echo "--- Environment variables (sorted) ---"
          env | sort